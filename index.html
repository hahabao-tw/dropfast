<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropZone 跨裝置互傳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #e2e8f0;
      color: #1d1d1f;
    }
    .apple-header {
      background: linear-gradient(135deg, #1d1d1f 0%, #2d2d30 100%);
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }
    .section-text {
      background: #ffffff;
      border-radius: 22px;
      border: 2px solid #cbd5e1;
      border-top: 6px solid #0071e3;
      box-shadow: 0 8px 24px rgba(0, 50, 120, 0.06);
    }
    .section-file {
      background: #ffffff;
      border-radius: 22px;
      border: 2px solid #cbd5e1;
      border-top: 6px solid #10b981;
      box-shadow: 0 8px 24px rgba(0, 90, 60, 0.06);
    }
    .apple-input {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .apple-input:focus {
      border-color: #0071e3;
      outline: none;
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6">

  <div class="max-w-3xl mx-auto space-y-8">
    
    <!-- 頂部深色導覽列 -->
    <div class="apple-header p-6 sm:p-7 text-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">⚡</span>
          <h1 class="text-2xl font-bold tracking-tight">DropZone</h1>
        </div>
        <p class="text-xs text-zinc-400 mt-1">跨裝置雲端中繼站 ・ 單檔上限 1TB ・ 6 小時自動銷毀</p>
      </div>
      <div class="flex items-center gap-2.5 w-full sm:w-auto">
        <button onclick="loadData()" id="refreshBtn" class="flex-1 sm:flex-none px-4 py-2 text-xs font-semibold bg-white/15 hover:bg-white/25 text-white rounded-full backdrop-blur transition">🔄 重新整理</button>
        <button onclick="clearAll()" id="clearAllBtn" class="flex-1 sm:flex-none px-4 py-2 text-xs font-semibold bg-rose-500 hover:bg-rose-600 text-white rounded-full transition">🗑️ 清空全部</button>
      </div>
    </div>

    <!-- 區塊一：文字傳送區 (Apple 藍色主題) -->
    <div class="section-text p-6 sm:p-8 space-y-5">
      <div class="flex items-center justify-between border-b border-slate-200 pb-4">
        <div class="flex items-center gap-3">
          <span class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center text-lg shadow-sm">📝</span>
          <div>
            <h2 class="text-lg font-bold text-slate-900">文字剪貼簿專區</h2>
            <p class="text-xs text-slate-500">快速同步網址、驗證碼或文字片段</p>
          </div>
        </div>
        <span class="text-xs font-semibold px-3 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-200">TEXT</span>
      </div>

      <!-- 文字輸入內艙 -->
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
        <textarea id="textInput" rows="3" class="apple-input w-full p-3.5 text-sm text-slate-800 placeholder-slate-400 resize-none" placeholder="在此輸入或貼上要傳送的文字..."></textarea>
        
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
          <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-slate-300 sm:w-64">
            <span class="text-slate-400 text-sm">🔒</span>
            <input type="password" id="textPassword" class="w-full text-sm text-slate-800 placeholder-slate-400 focus:outline-none" placeholder="設定文字密碼鎖 (選填)">
          </div>
          <button onclick="sendText()" id="sendTextBtn" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-sm transition">傳送文字</button>
        </div>
      </div>

      <!-- 文字列表 -->
      <div class="space-y-2.5 pt-2">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">已儲存的文字紀錄</h3>
        <div id="textList" class="space-y-2.5"></div>
      </div>
    </div>

    <!-- 區塊二：檔案傳送區 (翡翠綠主題) -->
    <div class="section-file p-6 sm:p-8 space-y-5">
      <div class="flex items-center justify-between border-b border-slate-200 pb-4">
        <div class="flex items-center gap-3">
          <span class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-lg shadow-sm">📁</span>
          <div>
            <h2 class="text-lg font-bold text-slate-900">檔案傳輸專區 (單檔上限 1TB)</h2>
            <p class="text-xs text-slate-500">直傳 Google Drive 雲端硬碟</p>
          </div>
        </div>
        <span class="text-xs font-semibold px-3 py-1 bg-emerald-50 text-emerald-700 rounded-full border border-emerald-200">MAX 1TB</span>
      </div>

      <!-- 檔案上傳內艙 -->
      <div class="bg-emerald-50/40 p-5 rounded-2xl border-2 border-dashed border-emerald-300 space-y-4">
        <input type="file" id="fileInput" class="block w-full text-sm text-slate-600 file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer"/>
        
        <div id="progressContainer" class="hidden space-y-1.5 bg-white p-3 rounded-xl border border-emerald-200">
          <div class="flex justify-between text-xs font-semibold text-emerald-700">
            <span>正在上傳至 Google Drive...</span>
            <span id="progressText">0%</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
            <div id="progressBar" class="bg-emerald-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-1">
          <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-slate-300 sm:w-64">
            <span class="text-slate-400 text-sm">🔒</span>
            <input type="password" id="filePassword" class="w-full text-sm text-slate-800 placeholder-slate-400 focus:outline-none" placeholder="設定檔案密碼鎖 (選填)">
          </div>
          <button onclick="uploadFile()" id="uploadBtn" class="px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-xl shadow-sm transition">開始上傳檔案</button>
        </div>
      </div>

      <!-- 檔案列表 -->
      <div class="space-y-2.5 pt-2">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">雲端暫存檔案列表</h3>
        <div id="fileList" class="space-y-2.5"></div>
      </div>
    </div>

  </div>

  <script>
    // 💡 請在此填入您的 GAS 部署網址 (/exec 結尾)
    const GAS_URL = "https://script.google.com/macros/s/AKfycby494FfbKlcJaeq56kcGxA3947LspZT4Ft-qdewD5aHGcvQ2z2BCN00q44ajzMWnHM-jw/exec";

    // 單檔大小上限設定：1TB (1,099,511,627,776 Bytes)
    const MAX_FILE_SIZE = 1024 * 1024 * 1024 * 1024;

    // 紀錄已在當前頁面解鎖過的文字內容
    const unlockedTextsCache = {};

    window.onload = loadData;

    // 自動格式化檔案大小 (B / KB / MB / GB / TB)
    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function callGasApi(payload) {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error("後端回應格式錯誤，請確認 GAS 已建立新版本部署");
      }
      if (json.status !== 'ok') throw new Error(json.message);
      return json.data;
    }

    async function loadData() {
      const btn = document.getElementById('refreshBtn');
      btn.innerText = '⏳ 同步中...';
      try {
        const data = await callGasApi({ action: 'getItems' });
        renderData(data);
      } catch (err) {
        alert('載入失敗：' + err.message);
      }
      btn.innerText = '🔄 重新整理';
    }

    function renderData(items) {
      const textContainer = document.getElementById('textList');
      const fileContainer = document.getElementById('fileList');

      const texts = items.filter(i => i.type === 'text');
      const files = items.filter(i => i.type === 'file');

      // 渲染文字列表
      if (texts.length === 0) {
        textContainer.innerHTML = `<div class="p-6 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-400 text-center">目前沒有文字紀錄</div>`;
      } else {
        textContainer.innerHTML = texts.map(item => {
          const displayContent = unlockedTextsCache[item.id] !== undefined ? unlockedTextsCache[item.id] : item.content;

          if (item.hasPassword && displayContent === null) {
            return `
              <div class="p-4 bg-amber-50/60 rounded-xl border border-amber-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="flex items-center gap-2 text-amber-800 text-sm font-medium">
                  <span>🔒</span>
                  <span>受密碼保護的隱藏文字</span>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                  <input type="password" id="pwd-${item.id}" class="apple-input px-3 py-1.5 text-xs sm:w-36" placeholder="輸入密碼..." onkeydown="if(event.key==='Enter') unlockText('${item.id}')">
                  <button onclick="unlockText('${item.id}')" id="unlockBtn-${item.id}" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-lg transition">解鎖查看</button>
                  <button onclick="deleteItem('${item.id}', 'text')" class="px-2.5 py-1.5 text-rose-600 hover:bg-rose-100 text-xs font-medium rounded-lg">刪除</button>
                </div>
              </div>
            `;
          } else {
            return `
              <div class="p-4 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="flex-1 min-w-0">
                  ${item.hasPassword ? '<span class="inline-block text-[11px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded mb-1">🔓 已解鎖</span>' : ''}
                  <pre class="text-sm text-slate-800 whitespace-pre-wrap break-all font-sans">${escapeHtml(displayContent)}</pre>
                </div>
                <div class="flex items-center gap-1.5 shrink-0 w-full sm:w-auto justify-end">
                  <button onclick="copyText('${ item.id }', \`${escapeBacktick(displayContent)}\`)" id="copyBtn-${item.id}" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-800 text-xs font-semibold rounded-lg transition">複製文字</button>
                  <button onclick="deleteItem('${item.id}', 'text')" class="px-2.5 py-1.5 text-rose-600 hover:bg-rose-50 text-xs font-medium rounded-lg">刪除</button>
                </div>
              </div>
            `;
          }
        }).join('');
      }

      // 渲染檔案列表
      if (files.length === 0) {
        fileContainer.innerHTML = `<div class="p-6 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-400 text-center">目前沒有暫存檔案</div>`;
      } else {
        fileContainer.innerHTML = files.map(f => `
          <div class="p-4 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="truncate pr-2">
              <div class="flex items-center gap-2">
                <span class="text-base">${f.hasPassword ? '🔒' : '📄'}</span>
                <p class="text-sm font-semibold text-slate-800 truncate">${escapeHtml(f.name)}</p>
                ${f.hasPassword ? '<span class="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-medium">需密碼</span>' : ''}
              </div>
              <p class="text-xs text-slate-400 mt-1 pl-6">${formatBytes(f.size)}</p>
            </div>
            <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
              ${f.hasPassword ? `<input type="password" id="filepwd-${f.id}" class="apple-input px-3 py-1.5 text-xs w-32" placeholder="輸入下載密碼" onkeydown="if(event.key==='Enter') downloadFile('${f.id}', true)">` : ''}
              <button onclick="downloadFile('${f.id}', ${f.hasPassword})" id="dlBtn-${f.id}" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition">下載檔案</button>
              <button onclick="deleteItem('${f.id}', 'file')" class="px-2.5 py-1.5 text-rose-600 hover:bg-rose-50 text-xs font-medium rounded-lg">刪除</button>
            </div>
          </div>
        `).join('');
      }
    }

    async function copyText(id, text) {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById(`copyBtn-${id}`);
      if (btn) {
        btn.innerText = '✅ 已複製';
        setTimeout(() => btn.innerText = '複製文字', 1500);
      }
    }

    async function sendText() {
      const input = document.getElementById('textInput');
      const pwdInput = document.getElementById('textPassword');
      const text = input.value.trim();
      if (!text) return alert('請輸入文字內容');
      
      const btn = document.getElementById('sendTextBtn');
      btn.innerText = '傳送中...';
      btn.disabled = true;

      try {
        const items = await callGasApi({ 
          action: 'saveTextItem', 
          text: text, 
          password: pwdInput.value.trim() 
        });
        input.value = '';
        pwdInput.value = '';
        renderData(items);
      } catch (err) {
        alert('傳送失敗：' + err.message);
      }
      btn.innerText = '傳送文字';
      btn.disabled = false;
    }

    async function unlockText(id) {
      const pwdInput = document.getElementById(`pwd-${id}`);
      const btn = document.getElementById(`unlockBtn-${id}`);
      const password = pwdInput.value.trim();
      if (!password) return alert('請輸入解鎖密碼');

      btn.innerText = '驗證中...';
      btn.disabled = true;

      try {
        const content = await callGasApi({ action: 'unlockText', id: id, password: password });
        unlockedTextsCache[id] = content;
        const data = await callGasApi({ action: 'getItems' });
        renderData(data);
      } catch (err) {
        alert('解鎖失敗：' + err.message);
        btn.innerText = '解鎖查看';
        btn.disabled = false;
      }
    }

    async function downloadFile(fileId, hasPassword) {
      let password = "";
      if (hasPassword) {
        const pwdEl = document.getElementById(`filepwd-${fileId}`);
        password = pwdEl ? pwdEl.value.trim() : "";
        if (!password) return alert("請先在左方輸入框填入檔案下載密碼！");
      }

      const btn = document.getElementById(`dlBtn-${fileId}`);
      const origText = btn.innerText;
      btn.innerText = '準備中...';
      btn.disabled = true;

      try {
        const url = await callGasApi({ action: 'getFileUrl', fileId: fileId, password: password });
        window.open(url, '_blank');
      } catch (err) {
        alert('下載失敗：' + err.message);
      } finally {
        btn.innerText = origText;
        btn.disabled = false;
      }
    }

    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const pwdInput = document.getElementById('filePassword');
      const file = fileInput.files[0];
      if (!file) return alert('請先選擇檔案');

      // 🔒 檢查單檔 1TB 上限
      if (file.size > MAX_FILE_SIZE) {
        fileInput.value = '';
        return alert(`檔案大小 (${formatBytes(file.size)}) 超過單檔 1TB 上限，無法上傳！`);
      }

      const uploadBtn = document.getElementById('uploadBtn');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');

      uploadBtn.disabled = true;
      progressContainer.classList.remove('hidden');

      try {
        const config = await callGasApi({ action: 'getUploadConfig' });
        const metadata = {
          name: file.name,
          mimeType: file.type || 'application/octet-stream',
          parents: [config.folderId]
        };

        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + config.token,
            'Content-Type': 'application/json; charset=UTF-8',
            'X-Upload-Content-Type': file.type || 'application/octet-stream',
            'X-Upload-Content-Length': file.size
          },
          body: JSON.stringify(metadata)
        });

        const uploadUrl = res.headers.get('Location');
        
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('PUT', uploadUrl, true);
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const percent = Math.round((e.loaded / e.total) * 100);
              progressBar.style.width = percent + '%';
              progressText.innerText = `${percent}% (${formatBytes(e.loaded)} / ${formatBytes(e.total)})`;
            }
          };
          xhr.onload = async () => {
            if (xhr.status === 200 || xhr.status === 201) {
              const fileData = JSON.parse(xhr.responseText);
              const items = await callGasApi({
                action: 'registerFile',
                fileId: fileData.id,
                fileName: file.name,
                fileSize: file.size,
                password: pwdInput.value.trim()
              });
              renderData(items);
              fileInput.value = '';
              pwdInput.value = '';
              resolve();
            } else {
              reject(new Error('上傳失敗'));
            }
          };
          xhr.onerror = () => reject(new Error('網路連線異常'));
          xhr.send(file);
        });

      } catch (err) {
        alert('上傳失敗：' + err.message);
      } finally {
        uploadBtn.disabled = false;
        progressContainer.classList.add('hidden');
        progressBar.style.width = '0%';
      }
    }

    async function clearAll() {
      if (!confirm('確定要清空雲端中繼站上的所有內容嗎？')) return;
      try {
        const items = await callGasApi({ action: 'clearAllItems' });
        renderData(items);
      } catch (err) {
        alert('清除失敗：' + err.message);
      }
    }

    async function deleteItem(id, type) {
      if (!confirm('確定要刪除此項目嗎？')) return;
      try {
        const items = await callGasApi({ action: 'deleteItem', id: id, type: type });
        renderData(items);
      } catch (err) {
        alert('刪除失敗：' + err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }

    function escapeBacktick(str) {
      if (!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
    }
  </script>
</body>
</html>
