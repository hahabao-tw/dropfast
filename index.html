<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropZone 跨裝置互傳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .apple-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    .apple-btn {
      background-color: #000000;
      color: #ffffff;
      border-radius: 980px;
      transition: all 0.2s ease;
    }
    .apple-btn:hover {
      background-color: #333333;
    }
    .apple-input {
      background: #f5f5f7;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .apple-input:focus {
      background: #ffffff;
      border-color: #0071e3;
      outline: none;
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6">

  <div class="max-w-2xl mx-auto space-y-6">
    <!-- 頂部標題列 -->
    <div class="apple-card p-6 sm:p-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">DropZone</h1>
        <p class="text-sm text-zinc-500 mt-0.5">極速跨裝置中繼站 ・ 6 小時自動銷毀</p>
      </div>
      <div class="flex items-center gap-2.5 w-full sm:w-auto">
        <button onclick="loadData()" id="refreshBtn" class="flex-1 sm:flex-none px-4 py-2 text-sm font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-800 rounded-full transition-colors">重新整理</button>
        <button onclick="clearAll()" id="clearAllBtn" class="flex-1 sm:flex-none px-4 py-2 text-sm font-medium bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-full transition-colors">清空全部</button>
      </div>
    </div>

    <!-- 文字傳送區 -->
    <div class="apple-card p-6 sm:p-8 space-y-4">
      <h2 class="text-lg font-medium text-zinc-900">📝 傳送文字</h2>
      <textarea id="textInput" rows="3" class="apple-input w-full p-3.5 text-sm text-zinc-800 placeholder-zinc-400 resize-none" placeholder="輸入要跨裝置同步的文字或連結..."></textarea>
      
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-1">
        <input type="password" id="textPassword" class="apple-input px-3.5 py-2 text-sm text-zinc-800 placeholder-zinc-400 sm:w-48" placeholder="設定密碼鎖 (選填)">
        <button onclick="sendText()" id="sendTextBtn" class="apple-btn px-6 py-2.5 text-sm font-medium">傳送文字</button>
      </div>
      
      <div id="textList" class="space-y-3 pt-4 border-t border-zinc-100"></div>
    </div>

    <!-- 檔案傳送區 -->
    <div class="apple-card p-6 sm:p-8 space-y-4">
      <h2 class="text-lg font-medium text-zinc-900">📁 傳送檔案</h2>
      <input type="file" id="fileInput" class="block w-full text-sm text-zinc-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-medium file:bg-zinc-100 file:text-zinc-800 hover:file:bg-zinc-200 cursor-pointer"/>
      
      <div id="progressContainer" class="hidden space-y-2">
        <div class="w-full bg-zinc-100 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <p id="progressText" class="text-xs text-zinc-400 text-right">0%</p>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-1">
        <input type="password" id="filePassword" class="apple-input px-3.5 py-2 text-sm text-zinc-800 placeholder-zinc-400 sm:w-48" placeholder="設定密碼鎖 (選填)">
        <button onclick="uploadFile()" id="uploadBtn" class="apple-btn px-6 py-2.5 text-sm font-medium">開始上傳</button>
      </div>

      <div id="fileList" class="space-y-3 pt-4 border-t border-zinc-100"></div>
    </div>
  </div>

  <script>
    // 💡 請在此填入您的 GAS 部署網址 (/exec 結尾)
    const GAS_URL = "https://script.google.com/macros/s/AKfycby494FfbKlcJaeq56kcGxA3947LspZT4Ft-qdewD5aHGcvQ2z2BCN00q44ajzMWnHM-jw/exec";

    window.onload = loadData;

    async function callGasApi(payload) {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error("後端回應格式錯誤，請確認 GAS 是否已建立新版本部署");
      }
      if (json.status !== 'ok') throw new Error(json.message);
      return json.data;
    }

    async function loadData() {
      const btn = document.getElementById('refreshBtn');
      btn.innerText = '同步中...';
      try {
        const data = await callGasApi({ action: 'getItems' });
        renderData(data);
      } catch (err) {
        alert('載入失敗：' + err.message);
      }
      btn.innerText = '重新整理';
    }

    function renderData(items) {
      const textContainer = document.getElementById('textList');
      const fileContainer = document.getElementById('fileList');

      const texts = items.filter(i => i.type === 'text');
      const files = items.filter(i => i.type === 'file');

      // 渲染文字列表
      if (texts.length === 0) {
        textContainer.innerHTML = `<p class="text-xs text-zinc-400 text-center py-4">目前沒有文字紀錄</p>`;
      } else {
        textContainer.innerHTML = texts.map(item => {
          if (item.hasPassword && !item.content) {
            // 需要密碼解鎖的狀態
            return `
              <div class="p-4 bg-zinc-50 rounded-2xl border border-zinc-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="flex items-center gap-2 text-zinc-500 text-sm">
                  <span>🔒</span>
                  <span>此文字受到密碼保護</span>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                  <input type="password" id="pwd-${item.id}" class="apple-input px-3 py-1.5 text-xs sm:w-32" placeholder="輸入解鎖密碼">
                  <button onclick="unlockText('${item.id}')" class="px-3 py-1.5 bg-zinc-900 text-white text-xs rounded-xl hover:bg-zinc-800">解鎖</button>
                  <button onclick="deleteItem('${item.id}', 'text')" class="px-2.5 py-1.5 text-rose-600 text-xs hover:bg-rose-50 rounded-xl">刪除</button>
                </div>
              </div>
            `;
          } else {
            // 已解鎖或無密碼
            return `
              <div class="p-4 bg-zinc-50 rounded-2xl border border-zinc-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <pre class="text-sm text-zinc-800 whitespace-pre-wrap break-all font-sans flex-1">${escapeHtml(item.content)}</pre>
                <div class="flex items-center gap-1.5 shrink-0 w-full sm:w-auto justify-end">
                  <button onclick="navigator.clipboard.writeText(\`${escapeHtml(item.content)}\`).then(()=>alert('已複製到剪貼簿'))" class="px-3 py-1.5 bg-white border border-zinc-200 text-zinc-700 text-xs rounded-xl hover:bg-zinc-100">複製</button>
                  <button onclick="deleteItem('${item.id}', 'text')" class="px-2.5 py-1.5 text-rose-600 text-xs hover:bg-rose-50 rounded-xl">刪除</button>
                </div>
              </div>
            `;
          }
        }).join('');
      }

      // 渲染檔案列表
      if (files.length === 0) {
        fileContainer.innerHTML = `<p class="text-xs text-zinc-400 text-center py-4">目前沒有暫存檔案</p>`;
      } else {
        fileContainer.innerHTML = files.map(f => `
          <div class="p-4 bg-zinc-50 rounded-2xl border border-zinc-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="truncate pr-2">
              <p class="text-sm font-medium text-zinc-800 truncate flex items-center gap-1.5">
                ${f.hasPassword ? '🔒' : ''} ${escapeHtml(f.name)}
              </p>
              <p class="text-xs text-zinc-400 mt-0.5">${(f.size / 1024 / 1024).toFixed(2)} MB</p>
            </div>
            <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
              <button onclick="downloadFile('${f.id}', ${f.hasPassword})" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded-xl transition-colors">下載檔案</button>
              <button onclick="deleteItem('${f.id}', 'file')" class="px-2.5 py-1.5 text-rose-600 text-xs hover:bg-rose-50 rounded-xl">刪除</button>
            </div>
          </div>
        `).join('');
      }
    }

    async function sendText() {
      const input = document.getElementById('textInput');
      const pwdInput = document.getElementById('textPassword');
      const text = input.value.trim();
      if (!text) return alert('請輸入文字內容');
      
      const btn = document.getElementById('sendTextBtn');
      btn.innerText = '傳送中...';
      btn.disabled = true;

      try {
        const items = await callGasApi({ 
          action: 'saveTextItem', 
          text: text, 
          password: pwdInput.value.trim() 
        });
        input.value = '';
        pwdInput.value = '';
        renderData(items);
      } catch (err) {
        alert('傳送失敗：' + err.message);
      }
      btn.innerText = '傳送文字';
      btn.disabled = false;
    }

    async function unlockText(id) {
      const pwdInput = document.getElementById(`pwd-${id}`);
      const password = pwdInput.value.trim();
      if (!password) return alert('請輸入解鎖密碼');

      try {
        const content = await callGasApi({ action: 'unlockText', id: id, password: password });
        // 直接重新整理列表以顯示解鎖後的內容
        loadData();
      } catch (err) {
        alert(err.message);
      }
    }

    async function downloadFile(fileId, hasPassword) {
      let password = "";
      if (hasPassword) {
        password = prompt("此檔案受密碼保護，請輸入下載密碼：");
        if (password === null) return; // 取消
      }

      try {
        const url = await callGasApi({ action: 'getFileUrl', fileId: fileId, password: password });
        window.open(url, '_blank');
      } catch (err) {
        alert('下載失敗：' + err.message);
      }
    }

    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const pwdInput = document.getElementById('filePassword');
      const file = fileInput.files[0];
      if (!file) return alert('請先選擇檔案');

      const uploadBtn = document.getElementById('uploadBtn');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');

      uploadBtn.disabled = true;
      progressContainer.classList.remove('hidden');

      try {
        const config = await callGasApi({ action: 'getUploadConfig' });
        const metadata = {
          name: file.name,
          mimeType: file.type || 'application/octet-stream',
          parents: [config.folderId]
        };

        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + config.token,
            'Content-Type': 'application/json; charset=UTF-8',
            'X-Upload-Content-Type': file.type || 'application/octet-stream',
            'X-Upload-Content-Length': file.size
          },
          body: JSON.stringify(metadata)
        });

        const uploadUrl = res.headers.get('Location');
        
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('PUT', uploadUrl, true);
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const percent = Math.round((e.loaded / e.total) * 100);
              progressBar.style.width = percent + '%';
              progressText.innerText = percent + '%';
            }
          };
          xhr.onload = async () => {
            if (xhr.status === 200 || xhr.status === 201) {
              const fileData = JSON.parse(xhr.responseText);
              const items = await callGasApi({
                action: 'registerFile',
                fileId: fileData.id,
                fileName: file.name,
                fileSize: file.size,
                password: pwdInput.value.trim()
              });
              renderData(items);
              fileInput.value = '';
              pwdInput.value = '';
              resolve();
            } else {
              reject(new Error('上傳失敗'));
            }
          };
          xhr.onerror = () => reject(new Error('網路連線異常'));
          xhr.send(file);
        });

      } catch (err) {
        alert('上傳失敗：' + err.message);
      } finally {
        uploadBtn.disabled = false;
        progressContainer.classList.add('hidden');
        progressBar.style.width = '0%';
      }
    }

    async function clearAll() {
      if (!confirm('確定要清空雲端中繼站上的所有內容嗎？')) return;
      try {
        const items = await callGasApi({ action: 'clearAllItems' });
        renderData(items);
      } catch (err) {
        alert('清除失敗：' + err.message);
      }
    }

    async function deleteItem(id, type) {
      if (!confirm('確定要刪除此項目嗎？')) return;
      try {
        const items = await callGasApi({ action: 'deleteItem', id: id, type: type });
        renderData(items);
      } catch (err) {
        alert('刪除失敗：' + err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }
  </script>
</body>
</html>
